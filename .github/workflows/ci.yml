name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: build the app (Command Line Tools only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Halo must build without Xcode: the Homebrew formula depends on that,
      # and it is why overlay/Sources avoids SwiftUI macros. Selecting the CLT
      # here is what stops a macro sneaking in unnoticed.
      - run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - run: swift build -c release --package-path overlay
      - run: overlay/build_app.sh
      # The app is signed ad-hoc, so its code hash IS its TCC identity. If the
      # same source can build to two different hashes, then every `brew install`
      # hands the user a "new" app and macOS silently voids their Accessibility
      # grant -- the hotkey just stops working. Homebrew builds in a randomly
      # named temp dir, so "different path" is the case that actually happens.
      - name: the build is reproducible (same source, different path)
        run: |
          set -e
          cdhash() { codesign -dv --verbose=4 "$1" 2>&1 | awk -F= '/^CDHash/{print $2}'; }
          a=$(cdhash overlay/Halo.app)
          mkdir -p /tmp/reprocheck
          tar -cf - --exclude=.build --exclude=Halo.app overlay VERSION \
            | tar -x -C /tmp/reprocheck
          (cd /tmp/reprocheck && overlay/build_app.sh >/dev/null)
          b=$(cdhash /tmp/reprocheck/overlay/Halo.app)
          echo "in the checkout : $a"
          echo "somewhere else  : $b"
          if [ -z "$a" ] || [ "$a" != "$b" ]; then
            echo "::error::not reproducible - every install would void Accessibility"
            exit 1
          fi

      # Apple's parser tolerates malformed XML; nothing else does. The
      # Info.plist shipped an XML comment containing "--" for months, which is
      # forbidden, and no build ever complained.
      - name: the plists are well-formed XML
        run: |
          python3 - <<'PY'
          import plistlib, pathlib, sys
          bad = []
          targets = {
              "overlay/Info.plist.in": {"__VERSION__": "0.0.0"},
              "launchd/io.github.tharuns123.halo.plist.template": {
                  "__APP_BINARY__": "/a", "__PYTHON__": "/b", "__ENGINE__": "/c",
                  "__PATH__": "/d", "__LOG_DIR__": "/e"},
              "overlay/Halo.app/Contents/Info.plist": {},
          }
          for name, subs in targets.items():
              text = pathlib.Path(name).read_text()
              for k, v in subs.items():
                  text = text.replace(k, v)
              try:
                  plistlib.loads(text.encode())
                  print("ok", name)
              except Exception as e:
                  bad.append(f"{name}: {e}")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          PY

      - name: the bundle is signed and identifies itself correctly
        run: |
          codesign -dv --verbose=2 overlay/Halo.app 2>&1 | tee /tmp/sign.txt
          grep -q "Identifier=io.github.tharuns123.halo" /tmp/sign.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            overlay/Halo.app/Contents/Info.plist

  python:
    name: offline tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: run the hermetic tests
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
      - name: lint
        run: |
          pip install ruff
          ruff check --output-format github .

      - name: the CLI works without an install
        run: |
          python cli.py --version
          python cli.py model list
      - name: shipped defaults are neutral and parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("defaults").glob("*.json"):
              text = p.read_text()
              json.loads(text)                      # must parse
              for term in ("Tharun", "Senthilkumar", "Purdue", "PLACEHOLDER"):
                  if term.lower() in text.lower():
                      bad.append(f"{p.name} still contains {term!r}")
          print("\n".join(bad) if bad else "defaults are clean")
          sys.exit(1 if bad else 0)
          PY

  shell:
    name: shell scripts parse
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Discovered, not listed: a hard-coded list silently stops covering the
      # next script someone adds, which is how scripts/make-icon.sh was missed.
      # No process substitution here on purpose -- a ")" in a case pattern
      # closes "<( )" early and the whole step dies with a syntax error.
      - name: every shell script parses
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "${f%.sh}" = "$f" ]; then
              [ -x "$f" ] || continue
              head -1 "$f" | grep -qE '^#!.*(bash|sh)$' || continue
            fi
            echo "checking $f"
            bash -n "$f"
            found=$((found + 1))
          done <<EOF
          $(git ls-files)
          EOF
          echo "$found shell scripts checked"
          [ "$found" -ge 5 ] || { echo "::error::found only $found - discovery is broken"; exit 1; }
